    <!-- Подключаем Tailwind CSS -->

    <!-- Подключаем шрифты Inter и Montserrat -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        softred: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    },
                    animation: {
                        'gradient-xy': 'gradient-xy 14s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        'gradient-xy': {
                            '0%, 100%': {
                                'background-size': '300% 300%',
                                'background-position': '0% 50%'
                            },
                            '50%': {
                                'background-size': '300% 300%',
                                'background-position': '100% 50%'
                            }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'fadeInUp': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }

        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow:

                0 0 0 1px rgba(255, 255, 255, 0.45) inset;

        /* Эффект матового стекла (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            <!-- Кнопка 1: Telegram Channel -->

    <!-- Всплывающее уведомление (Toast) -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full bg-rose-950/90 text-white text-xs sm:text-sm font-medium shadow-xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3">
        Готово!
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const shareFooterBtn = document.getElementById('shareFooterBtn');
            const toast = document.getElementById('toastNotification');
            let toastTimeout;

            // Функция показа аккуратного уведомления при копировании ссылки
            function showToast(message) {
                toast.textContent = message;
                toast.classList.remove('opacity-0', 'translate-y-3');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-3');
                }, 2600);
            }

            // Копирование ссылки на страницу
            function copyPageUrl() {
                const urlToCopy = window.location.href;
                const tempInput = document.createElement('input');
                tempInput.value = urlToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast('Ссылка на визитку скопирована 📋');
                } catch (err) {
                    showToast('Не удалось скопировать ссылку');
                }
                document.body.removeChild(tempInput);
            }

            shareFooterBtn.addEventListener('click', copyPageUrl);
        });
    </script>
</body>
