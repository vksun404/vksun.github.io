    <!-- Подключаем шрифты Inter и Montserrat -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        softred: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    },
                    animation: {
                        'gradient-xy': 'gradient-xy 14s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'sway-slow': 'sway 9s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        'gradient-xy': {
                            '0%, 100%': {
                                'background-size': '300% 300%',
                                'background-position': '0% 50%'
                            },
                            '50%': {
                                'background-size': '300% 300%',
                                'background-position': '100% 50%'
                            }
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'sway': {
                            '0%, 100%': { transform: 'rotate(-3deg) translateY(0px)' },
                            '50%': { transform: 'rotate(4deg) translateY(-8px)' },
                        },
                        'fadeInUp': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Плавный насыщенный градиентный фон в красных и кораллово-малиновых оттенках */
        .soft-red-gradient {
            background: linear-gradient(135deg, #ffa4b4 0%, #fb6882 35%, #f43f5e 70%, #e11d48 100%);
            background-size: 300% 300%;
        }

        /* Эффект матового стекла (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.74);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.68);
            box-shadow: 
                0 25px 50px -12px rgba(159, 18, 57, 0.22),
                0 0 0 1px rgba(255, 255, 255, 0.42) inset;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Декоративные паучьи лилии по бокам от аватарки */
        .side-lily {
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        .side-lily:hover {
            filter: drop-shadow(0 6px 12px rgba(190, 18, 60, 0.28));
        }

        /* Аура цветового искажения вокруг курсора на заднем фоне */
        .cursor-distortion-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .cursor-chroma-orb {
            position: fixed;
            top: 0;
            left: 0;
            width: 340px;
            height: 340px;
            margin-left: -170px;
            margin-top: -170px;
            border-radius: 9999px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }

        /* Слой смещения оттенка (Hue / Overlay) */
        .cursor-chroma-hue {
            background: radial-gradient(
                circle at 42% 42%,
                rgba(255, 228, 196, 0.72) 0%,
                rgba(255, 77, 136, 0.58) 34%,
                rgba(190, 18, 60, 0.36) 62%,
                rgba(225, 29, 72, 0) 76%
            );
            mix-blend-mode: hue;
            filter: blur(22px) saturate(165%);
            animation: chromaPulse 5s ease-in-out infinite;
        }

        /* Слой мягкого персиково-малинового свечения и хроматической аберрации */
        .cursor-chroma-glow {
            width: 260px;
            height: 260px;
            margin-left: -130px;
            margin-top: -130px;
            background: radial-gradient(
                circle at 56% 52%,
                rgba(255, 241, 242, 0.55) 0%,
                rgba(253, 164, 175, 0.45) 36%,
                rgba(244, 63, 94, 0.25) 64%,
                transparent 78%
            );
            mix-blend-mode: overlay;
            filter: blur(18px) contrast(125%);
            animation: chromaPulse 5s ease-in-out infinite reverse;
        }

        @keyframes chromaPulse {
            0%, 100% {
                border-radius: 54% 46% 48% 52% / 52% 54% 46% 48%;
            }
            50% {
                border-radius: 46% 54% 52% 48% / 48% 46% 54% 52%;
            }
        }

        /* Задержки для анимации последовательного появления */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>

    <!-- Всплывающее уведомление (Toast) -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-full bg-rose-950/90 text-white text-xs sm:text-sm font-medium shadow-xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3">
        Готово!
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const shareFooterBtn = document.getElementById('shareFooterBtn');
            const toast = document.getElementById('toastNotification');
            let toastTimeout;

            // Функция показа аккуратного уведомления при копировании ссылки
            function showToast(message) {
                toast.textContent = message;
                toast.classList.remove('opacity-0', 'translate-y-3');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-3');
                }, 2600);
            }

            // Копирование ссылки на страницу
            function copyPageUrl() {
                const urlToCopy = window.location.href;
                const tempInput = document.createElement('input');
                tempInput.value = urlToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast('Ссылка на визитку скопирована 📋');
                } catch (err) {
                    showToast('Не удалось скопировать ссылку');
                }
                document.body.removeChild(tempInput);
            }

            shareFooterBtn.addEventListener('click', copyPageUrl);

            // ==========================================
            // 1. Живое покачивание + 3D-наклон белой панели при наведении
            // и цветовое искажение вокруг курсора на заднем фоне
            // ==========================================
            const tiltCard = document.getElementById('tiltCard');
            const cursorChromaHue = document.getElementById('cursorChromaHue');
            const cursorChromaGlow = document.getElementById('cursorChromaGlow');
            const isDesktopPointer = window.matchMedia('(hover: hover) and (pointer: fine)');

            if (isDesktopPointer.matches) {
                let isHoveringCard = false;
                let mouseNormX = 0;
                let mouseNormY = 0;
                let currentRotX = 0;
                let currentRotY = 0;
                let currentRotZ = 0;

                // Координаты для плавного следования цветового искажения за курсором
                let targetMouseX = window.innerWidth / 2;
                let targetMouseY = window.innerHeight / 2;
                let currentHueX = targetMouseX;
                let currentHueY = targetMouseY;
                let currentGlowX = targetMouseX;
                let currentGlowY = targetMouseY;
                let isPointerOnBackground = false;

                // Отслеживание положения курсора на заднем фоне
                document.addEventListener('mousemove', (e) => {
                    targetMouseX = e.clientX;
                    targetMouseY = e.clientY;

                    if (!isHoveringCard) {
                        isPointerOnBackground = true;
                        if (cursorChromaHue) cursorChromaHue.style.opacity = '0.95';
                        if (cursorChromaGlow) cursorChromaGlow.style.opacity = '0.9';
                    }
                });

                document.addEventListener('mouseleave', () => {
                    isPointerOnBackground = false;
                    if (cursorChromaHue) cursorChromaHue.style.opacity = '0';
                    if (cursorChromaGlow) cursorChromaGlow.style.opacity = '0';
                });

                // Взаимодействие курсора с белой карточкой
                if (tiltCard) {
                    tiltCard.addEventListener('mouseenter', () => {
                        isHoveringCard = true;
                        isPointerOnBackground = false;
                        // Мягко затухаем фоновое искажение при наведении на панель
                        if (cursorChromaHue) cursorChromaHue.style.opacity = '0';
                        if (cursorChromaGlow) cursorChromaGlow.style.opacity = '0';
                    });

                    tiltCard.addEventListener('mousemove', (e) => {
                        const rect = tiltCard.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;

                        // Нормализованные координаты от -1 до 1 относительно центра карточки
                        mouseNormX = (x - rect.width / 2) / (rect.width / 2);
                        mouseNormY = (y - rect.height / 2) / (rect.height / 2);
                    });

                    tiltCard.addEventListener('mouseleave', () => {
                        isHoveringCard = false;
                        mouseNormX = 0;
                        mouseNormY = 0;
                    });
                }

                // Единый плавный цикл анимации для покачивания карточки и фоновой ауры
                function animateInteractiveEffects(timestamp) {
                    const t = timestamp * 0.001;

                    // 1. Плавное движение слоев хроматического искажения с легким параллаксом
                    currentHueX += (targetMouseX - currentHueX) * 0.14;
                    currentHueY += (targetMouseY - currentHueY) * 0.14;
                    currentGlowX += (targetMouseX - currentGlowX) * 0.09;
                    currentGlowY += (targetMouseY - currentGlowY) * 0.09;

                    if (cursorChromaHue && cursorChromaGlow) {
                        const swayOffsetX = Math.sin(t * 2.1) * 8;
                        const swayOffsetY = Math.cos(t * 1.8) * 8;
                        const pulseScale = 1 + Math.sin(t * 2.4) * 0.06;

                        cursorChromaHue.style.transform = `translate3d(${(currentHueX + swayOffsetX).toFixed(1)}px, ${(currentHueY + swayOffsetY).toFixed(1)}px, 0) scale(${pulseScale.toFixed(3)})`;
                        cursorChromaGlow.style.transform = `translate3d(${(currentGlowX - swayOffsetX).toFixed(1)}px, ${(currentGlowY - swayOffsetY).toFixed(1)}px, 0) scale(${(2 - pulseScale).toFixed(3)})`;
                    }

                    // 2. Плавное покачивание и 3D-наклон центральной панели при наведении
                    if (tiltCard) {
                        let targetRotX = 0;
                        let targetRotY = 0;
                        let targetRotZ = 0;

                        if (isHoveringCard) {
                            // Сочетание 3D-наклона к курсору и мягкого гармонического покачивания
                            const swayX = Math.sin(t * 2.6) * 1.4;
                            const swayY = Math.cos(t * 2.1) * 1.6;
                            const swayZ = Math.sin(t * 1.9) * 0.95;

                            targetRotX = -mouseNormY * 5.5 + swayX;
                            targetRotY = mouseNormX * 5.5 + swayY;
                            targetRotZ = mouseNormX * 0.7 + swayZ;
                        }

                        currentRotX += (targetRotX - currentRotX) * 0.08;
                        currentRotY += (targetRotY - currentRotY) * 0.08;
                        currentRotZ += (targetRotZ - currentRotZ) * 0.08;

                        if (
                            isHoveringCard ||
                            Math.abs(currentRotX) > 0.01 ||
                            Math.abs(currentRotY) > 0.01 ||
                            Math.abs(currentRotZ) > 0.01
                        ) {
                            tiltCard.style.transform = `perspective(1000px) rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg) rotateZ(${currentRotZ.toFixed(2)}deg)`;
                        } else {
                            tiltCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) rotateZ(0deg)';
                        }
                    }

                    requestAnimationFrame(animateInteractiveEffects);
                }

                requestAnimationFrame(animateInteractiveEffects);
            }
        });
    </script>
